<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Español">
  <meta name="theme-color" content="#F6F1E8">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- The Home Screen icon for iPhone and iPad. iOS keeps the icon from the day of "Add to Home Screen".
       The source is icons/icon.svg. The Mac takes its Dock icon from the manifest. -->
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="preload" href="fonts/anton-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <title>Spanish practice</title>
</head>
<body>
<main>
  <!-- Shows when Safari cannot save data. -->
  <p id="banner-storage" class="banner" role="alert" data-t="storageBlocked" hidden></p>

  <!-- Screen 1: choose a profile. -->
  <section id="screen-profile" hidden>
    <h1 data-t="appTitle"></h1>
    <!-- Decorative masthead word and a strip of cut paper (CSS only). -->
    <p class="masthead-word" aria-hidden="true" lang="es">Español</p>
    <div class="papel-picado" aria-hidden="true"></div>
    <h2 data-t="chooseProfile"></h2>
    <p class="note" data-t="chooseProfileHint"></p>
    <div class="stack">
      <button type="button" class="big" data-profile="cade"></button>
      <button type="button" class="big" data-profile="casey"></button>
    </div>
  </section>

  <!-- Screen 2: list of lessons. -->
  <section id="screen-lessons" hidden>
    <header class="topbar">
      <div class="topbar-id">
        <h1 data-t="appTitle"></h1>
        <p id="lessons-profile" class="note"></p>
      </div>
      <button type="button" id="btn-settings" class="secondary" data-t="settings"></button>
    </header>
    <!-- Decorative masthead word and a strip of cut paper (CSS only). -->
    <p class="masthead-word" aria-hidden="true" lang="es">Español</p>
    <div class="papel-picado" aria-hidden="true"></div>
    <p id="lessons-status" class="status" role="status"></p>
    <button type="button" id="btn-retry" data-t="retry" hidden></button>
    <div id="lessons-list" class="stack"></div>
    <details id="lessons-problems" hidden>
      <summary id="lessons-problems-title"></summary>
      <div id="lessons-problems-body"></div>
    </details>
  </section>

  <!-- Screen 3: one lesson. -->
  <section id="screen-lesson" hidden>
    <button type="button" id="btn-lesson-back" class="secondary" data-t="back"></button>
    <h1 id="lesson-title"></h1>
    <p id="lesson-title-en" class="note"></p>
    <!-- runner.js draws the lesson here: start, exercises, and the end. -->
    <div id="lesson-runner"></div>
  </section>

  <!-- Screen 4: settings. -->
  <section id="screen-settings" hidden>
    <button type="button" id="btn-settings-back" class="secondary" data-t="back" hidden></button>
    <h1 data-t="settings"></h1>
    <p id="settings-notice" class="warn" hidden></p>

    <label for="sel-profile" data-t="profile"></label>
    <select id="sel-profile"></select>

    <label for="sel-lang" data-t="explanationLang"></label>
    <select id="sel-lang">
      <option value="en" data-t="langEnglish"></option>
      <option value="es" data-t="langSpanish"></option>
    </select>

    <label for="inp-key" data-t="azureKey"></label>
    <input id="inp-key" type="text" class="secret" autocomplete="off" autocapitalize="off"
           autocorrect="off" spellcheck="false">

    <label for="inp-region" data-t="azureRegion"></label>
    <input id="inp-region" type="text" autocomplete="off" autocapitalize="off"
           autocorrect="off" spellcheck="false">
    <p class="note" data-t="regionHint"></p>

    <div class="row">
      <button type="button" id="btn-save" data-t="save"></button>
      <button type="button" id="btn-delete-key" class="secondary" data-t="deleteKey"></button>
    </div>
    <p id="settings-status" class="status" role="status"></p>

    <h2 data-t="privacyTitle"></h2>
    <p data-t="privacyNote"></p>
    <p data-t="homeScreenTip"></p>

    <h2 data-t="backupTitle"></h2>
    <p class="note" data-t="backupHint"></p>
    <div class="row">
      <button type="button" id="btn-backup-save" class="secondary" data-t="backupSave"></button>
      <!-- A label opens the file chooser. This works on iPhone without a script. -->
      <label for="inp-backup-file" id="btn-backup-load" class="button secondary" data-t="backupLoad"></label>
    </div>
    <input id="inp-backup-file" type="file" accept=".json,application/json" class="visually-hidden">
    <div id="backup-confirm" class="confirm" hidden>
      <p data-t="backupConfirmReplace"></p>
      <div class="row">
        <button type="button" id="btn-backup-yes" data-t="backupConfirmYes"></button>
        <button type="button" id="btn-backup-no" class="secondary" data-t="cancel"></button>
      </div>
    </div>
    <p id="backup-status" class="status" role="status"></p>
  </section>
</main>

<script src="js/config.js"></script>
<script src="js/storage.js"></script>
<script src="js/text.js"></script>
<script src="js/lessons.js"></script>
<script src="js/vendor/microsoft.cognitiveservices.speech.sdk.bundle-min.js"></script>
<script src="js/audio.js"></script>
<script src="js/speech.js"></script>
<script src="js/score-view.js"></script>
<script src="js/ex-listen-choose.js"></script>
<script src="js/ex-listen-type.js"></script>
<script src="js/ex-repeat.js"></script>
<script src="js/ex-read-aloud.js"></script>
<script src="js/runner.js"></script>
<script src="js/app.js"></script>
</body>
</html>
